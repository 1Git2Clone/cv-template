# ==============================================================================
# CI — Forgejo
# ==============================================================================
# The existence of THIS DIRECTORY is what stops Forgejo running
# .github/workflows/ci.yml. Forgejo looks for .forgejo/workflows first and
# only falls back to .github/workflows when that directory is absent — a fallback, not
# a union. Before this file existed, the GitHub workflow ran on both forges,
# and on this one it failed: see the `runs-on` note below.
#
# So the two files are not duplicates to keep in sync for tidiness. They are
# one per forge, and deleting this one silently hands Forgejo the GitHub
# file again.
#
# git.hu-tao.dev is the source of truth and GitHub is a push-only mirror, so
# this is the run that actually gates the repo; the mirror's run is the
# redundant one. Both exist because the mirror should stand on its own.
#
# COST. Every job here runs on the VPS that also serves mail, git and the
# minecraft server. The runner's `cache:` is disabled and its `valid_volumes`
# allow-list has no entry for a nix store, so nothing is reused between runs:
# each one rebuilds the `.#ci` shell from the binary cache. Nix itself is no
# longer part of that bill — it is in the image — but the shell still is, which
# is the reason for a single job rather than the two the GitHub file uses.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and evaluate
    # `nix-node`, declared in the vps repo's modules/runner/ci-image.nix, and
    # NOT any of the other four labels this runner offers:
    #
    #   ubuntu-latest / node-22  node:22-bookworm — has node, has no nix, and
    #                            has no `sudo`, which cachix/install-nix-action
    #                            shells out to unconditionally on its
    #                            non-systemd branch. Every run died at exit 127
    #                            before a single check ran.
    #   nix                      nixos/nix — has nix, has no node. Every
    #                            JavaScript action is executed by a node binary
    #                            inside the job container, so `uses:` cannot run
    #                            there at all and the checkout has to be a
    #                            hand-written `git fetch`.
    #   nix-node                 both. Which is what lets this file use
    #                            actions/checkout below.
    runs-on: nix-node

    env:
      # NIX_CONFIG is deliberately absent: the nix-node image bakes
      # `experimental-features = nix-command flakes` into its /etc/nix/nix.conf,
      # asserted by tests/ci-image.nix in the vps repo. Re-declaring it here
      # would be a second copy to keep in step with the image.
      #
      # GIT_TERMINAL_PROMPT stays. actions/checkout authenticates, so nothing
      # should ever prompt — but if that ever regresses, a prompt in a
      # non-interactive container is a hang that burns the job's full 30m
      # timeout, and this turns it into an immediate, readable failure.
      GIT_TERMINAL_PROMPT: "0"

    steps:
      # The action, not a hand-written `git fetch`. This repository is private,
      # and the checkout is where that used to matter: a hand-written fetch is
      # anonymous unless the author threads the job token through it, an
      # anonymous fetch works fine on a public repo, and so the omission was
      # invisible on every other repo on this instance and fatal here —
      #
      #   fatal: could not read Username for 'https://git.hu-tao.dev':
      #   terminal prompts disabled
      #   [runner]: exitcode '128': failure
      #
      # actions/checkout defaults its `token` input to the token Forgejo
      # injects, so the private case needs nothing from this file at all.
      #
      # The bare `actions/checkout` form resolves against DEFAULT_ACTIONS_URL,
      # unset on this instance and therefore Forgejo's own default of
      # https://code.forgejo.org — which carries a synced mirror of the
      # upstream action. Pinned to the same tag .github/workflows/ci.yml uses,
      # so both forges run identical checkout logic.
      #
      # No fetch-depth. The default shallow clone is enough because nothing
      # here reads history: the hooks are the LaTeX compile, markdownlint,
      # nixfmt and statix, and all four work on the checked-out tree. The old
      # hand-written fetch pulled every branch and PR ref because it was
      # copied from the vps repo, where gitleaks scans commits — a cost this
      # repo was paying for a hook it does not have.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The same file the local commit hook uses, so a green CI means a clean
      # `pre-commit run --all-files` on the developer's machine and vice versa.
      - name: pre-commit
        run: nix develop .#ci -c pre-commit run --all-files --show-diff-on-failure

      # nix flake check is also run locally via `nix flake check`.
      # The --no-build flag keeps this fast — it evaluates everything
      # without compiling anything.
      - name: nix flake check
        run: nix flake check --no-build --print-build-logs
