# ==============================================================================
# CI
# ==============================================================================
# The mirror's copy. Its twin is .forgejo/workflows/ci.yml, and the split
# is not cosmetic: Forgejo reads .forgejo/workflows and falls back to
# .github/workflows only when that directory is absent. So this file runs
# on GitHub alone — but delete .forgejo/workflows and Forgejo picks THIS
# file up again, where `permissions:` below is ignored with a warning
# and neither `uses:` below can run at all — see the Forgejo file.
#
# Keep the two in step by intent rather than by copy-paste. They check the
# same things; they differ in job layout and in that the Forgejo one uses
# no actions at all — it runs in an image that already has Nix and therefore
# has no node to execute a JavaScript action with. The reasons are written
# down over there.
#
# install-nix-action stays HERE because a GitHub runner is a VM with
# systemd and sudo, which is the branch of its installer that works.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point linting a commit that is
# already two commits stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The same file the local commit hook uses, so a green CI means a clean
      # `pre-commit run --all-files` on the developer's machine and vice versa.
      - name: pre-commit
        run: nix develop .#ci -c pre-commit run --all-files --show-diff-on-failure

      # nix flake check is also run locally via `nix flake check`.
      # The --no-build flag keeps this fast — it evaluates everything
      # without compiling anything.
      - name: nix flake check
        run: nix flake check --no-build --print-build-logs
